<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Álbum Mundial 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="banner">
    <img src="img/banner.JPG" class="banner-img" alt="Banner Álbum Mundial 2026">
    <div class="banner-overlay">
      <h1>⚽ Álbum Mundial 2026</h1>
    </div>
  </header>

  <nav>
    <button type="button" onclick="cambiarTab('album')">📘</button>
    <button type="button" onclick="cambiarTab('repetidas')">🔁</button>
    <button type="button" onclick="cambiarTab('intercambio')">🤝</button>
    <button type="button" onclick="cambiarTab('dashboard')">📊</button>
  </nav>

  <main>

    <!-- ÁLBUM -->
    <div id="album" class="tab">

      <!-- ✅ BACKUP ÁLBUM -->
      <div style="margin:10px; display:flex; gap:10px; flex-wrap:wrap;">
        <button type="button" onclick="exportarData()">💾 Descargar Álbum</button>

        <input type="file"
               accept=".json"
               onclick="this.value=null"
               onchange="importarDataArchivo(event)">
      </div>

      <!-- ✅ BUSCADOR -->
      <input id="buscar" class="input-buscador"
             placeholder="🔎 Buscar equipo..."
             onkeyup="filtrarEquipos()">

      <!-- ✅ CONTENIDO -->
      <div id="contenedor"></div>
    </div>

    <!-- REPETIDAS -->
    <div id="repetidas" class="tab oculto">

      <div class="form-rep">
        <select id="equipoRep"></select>
        <input id="numRep" type="number">

        <select id="tipoRep">
          <option value="intercambio">🔁</option>
        </select>

        <button type="button" onclick="agregarRepetida()">+</button>
      </div>

      <button type="button" onclick="exportarRepetidas()">💾 Descargar Repetidas</button>

      <input type="file" accept=".json" onchange="importarRepetidasArchivo(event)">

      <input id="buscarRep" class="input-buscador"
             placeholder="🔎 Buscar repetidas..."
             onkeyup="filtrarRepetidas()">

      <!-- ✅ SOLO UNA VEZ -->
      <div id="contenedorRep"></div>

      <h3 id="valorTotal"></h3>
    </div>

    <!-- INTERCAMBIO -->
    <div id="intercambio" class="tab oculto">
      <h3 style="margin-left:10px;">💡 Intercambio sugerido</h3>

      <input id="buscarInter" class="input-buscador"
             placeholder="🔎 Buscar intercambio..."
             onkeyup="filtrarIntercambio()"
             style="width:95%; margin:10px; padding:8px; border-radius:8px; border:none;">

      <div id="resultado"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="tab oculto">
      <div id="dashboardData"></div>
    </div>

  </main>

  <!-- ✅ MODAL GUÍA -->
  <div id="modalGuia" class="modal oculto">
    <div class="modal-contenido">
      <div class="modal-header">
        <h3 id="modalTitulo">💡 Intercambio sugerido</h3>
        <button type="button" class="modal-cerrar" onclick="cerrarModalGuia()">✖</button>
      </div>

      <div id="modalTexto" class="modal-body"></div>
    </div>
  </div>

  <footer id="progreso"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
