<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Álbum Mundial 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="banner">
  <img src="img/banner.JPG" class="banner-img">
  <div class="banner-overlay">
    <h1>⚽ Álbum Mundial 2026</h1>
  </div>
</header>

<nav>
  <button onclick="cambiarTab('album')">📘</button>
  <button onclick="cambiarTab('repetidas')">🔁</button>
  <button onclick="cambiarTab('intercambio')">🤝</button>
  <button onclick="cambiarTab('dashboard')">📊</button>
</nav>


<main>

<!-- ÁLBUM -->

<div id="album" class="tab">

  <!-- ✅ BACKUP ÁLBUM -->
  <div style="margin:10px; display:flex; gap:10px; flex-wrap:wrap;">

    <button onclick="exportarData()">💾 Descargar Álbum</button>

    <input type="file" 
           onclick="this.value=null" 
           onchange="importarDataArchivo(event)">

  </div>

  <!-- ✅ BUSCADOR -->

<input id="buscar" class="input-buscador"
placeholder="🔎 Buscar equipo..."
onkeyup="filtrarEquipos()">


  <!-- ✅ CONTENIDO -->
  <div id="contenedor"></div>

</div>


<!-- REPETIDAS -->
<div id="repetidas" class="tab oculto">

  <div class="form-rep">
    <select id="equipoRep"></select>
    <input id="numRep" type="number">

    <select id="tipoRep">
      <option value="intercambio">🔁</option>
      <option value="venta">💰</option>
    </select>

    <button onclick="agregarRepetida()">+</button>
  </div>

  <button onclick="exportarRepetidas()">💾 Descargar Repetidas</button>

  <input type="file" onchange="importarRepetidasArchivo(event)">

  
<input id="buscarRep" class="input-buscador"
placeholder="🔎 Buscar repetidas..."
onkeyup="filtrarRepetidas()">


  <!-- ✅ SOLO UNA VEZ -->
  <div id="contenedorRep"></div>

  <h3 id="valorTotal"></h3>

</div>


<!-- INTERCAMBIO -->
<div id="intercambio" class="tab oculto">
<h3 style="margin-left:10px;">💡 Intercambio sugerido</h3>
<input id="buscarInter" class="input-buscador"
  placeholder="🔎 Buscar intercambio..."
  onkeyup="filtrarIntercambio()"
  style="width:95%; margin:10px; padding:8px; border-radius:8px; border:none;">


<div id="resultado"></div>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="tab oculto">
  <div id="dashboardData"></div>
</div>

</main>

<footer id="progreso"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
